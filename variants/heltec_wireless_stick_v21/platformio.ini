; Heltec Wireless Stick v2.1 standalone variant.
;
; This variant uses the v1.15-compatible LoRa pin configuration
; (P_LORA_DIO_1 as IRQ, P_LORA_RESET=RADIOLIB_NC, P_LORA_BUSY=RADIOLIB_NC)
; which is required for correct operation on the Wireless Stick v2.1.
; The upstream heltec_v2 variant was updated in v1.17 to use P_LORA_DIO_0
; and P_LORA_RESET=14; that change breaks radio initialisation on this board,
; causing halt() to be called and leaving BLE and the display unreachable.

[Heltec_wireless_stick_v21_base]
extends = esp32_base
board = heltec_wifi_lora_32_V2
build_flags =
  ${esp32_base.build_flags}
  -I variants/heltec_wireless_stick_v21
  -D HELTEC_LORA_V2
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D P_LORA_DIO_1=26
  -D P_LORA_NSS=18
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_BUSY=RADIOLIB_NC
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=27
  -D P_LORA_TX_LED=25
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=20
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=15
  -D PIN_USER_BTN=0
  -D PIN_OLED_RESET=16
  -D HELTEC_WIRELESS_STICK_V21=1
  -D SCREEN_WIDTH=64
  -D SCREEN_HEIGHT=32
  -D DISPLAY_WIDTH=64
  -D DISPLAY_HEIGHT=32
  -D SSD1306_DISPLAY_OFFSET=32
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_wireless_stick_v21>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:Heltec_wireless_stick_v21_companion_radio_ble]
extends = Heltec_wireless_stick_v21_base
build_flags =
  ${Heltec_wireless_stick_v21_base.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=128
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_wireless_stick_v21_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_wireless_stick_v21_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Heltec_wireless_stick_v21_companion_radio_ble_staticpin]
extends = env:Heltec_wireless_stick_v21_companion_radio_ble
build_flags =
  ${env:Heltec_wireless_stick_v21_companion_radio_ble.build_flags}
  -D FORCE_STATIC_BLE_PIN=1
