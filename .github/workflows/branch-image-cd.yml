name: Branch Image CD Pack

on:
  push:
    tags:
      - 'room-ext-persistent-storage-*'
  workflow_dispatch:
    inputs:
      firmware_family:
        description: Firmware family to package
        required: true
        default: room-server
        type: choice
        options:
          - room-server
          - repeater
          - companion
          - all
      disable_debug:
        description: Disable debug build flags
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  package-images:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build selected firmware image pack
        env:
          FIRMWARE_VERSION: branch-${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_FAMILY="${{ inputs.firmware_family }}"
            BUILD_DISABLE_DEBUG="${{ inputs.disable_debug }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if echo "${TAG_NAME}" | grep -qi "room-server"; then
              BUILD_FAMILY="room-server"
            elif echo "${TAG_NAME}" | grep -qi "repeater"; then
              BUILD_FAMILY="repeater"
            elif echo "${TAG_NAME}" | grep -qi "companion"; then
              BUILD_FAMILY="companion"
            else
              BUILD_FAMILY="all"
            fi
            BUILD_DISABLE_DEBUG="true"
          fi

          echo "Building family: ${BUILD_FAMILY}"

          if [ "${BUILD_DISABLE_DEBUG}" = "true" ]; then
            export DISABLE_DEBUG=1
          else
            export DISABLE_DEBUG=0
          fi

          case "${BUILD_FAMILY}" in
            room-server)
              /usr/bin/env bash build.sh build-room-server-firmwares
              ;;
            repeater)
              /usr/bin/env bash build.sh build-repeater-firmwares
              ;;
            companion)
              /usr/bin/env bash build.sh build-companion-firmwares
              ;;
            all)
              /usr/bin/env bash build.sh build-firmwares
              ;;
            *)
              echo "Unsupported firmware_family: ${BUILD_FAMILY}"
              exit 1
              ;;
          esac

      - name: Build artifact archive
        run: |
          mkdir -p artifacts
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARCHIVE_FAMILY="${{ inputs.firmware_family }}"
          else
            ARCHIVE_FAMILY="tag"
          fi
          ARCHIVE_NAME="${ARCHIVE_FAMILY}-images-${{ github.run_number }}-${{ github.sha }}.tar.gz"
          tar -czf "artifacts/${ARCHIVE_NAME}" -C out .

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: branch-images-pack
          path: artifacts/*.tar.gz

      - name: Create draft release for branch tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/room-ext-persistent-storage-')
        with:
          name: Branch Images ${{ github.ref_name }}
          body: "Automated branch image package from workflow run ${{ github.run_number }}."
          draft: true
          files: artifacts/*.tar.gz
